<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>eLMaTrIx - Acceso</title>
<script>
// Apply the theme before first paint. ?theme=light|dark overrides for this load only.
(function () {
  try {
    var q = new URLSearchParams(location.search).get("theme");
    var t = (q === "light" || q === "dark") ? q : null;
    if (!t) { var s = localStorage.getItem("elmatrix_theme"); if (s === "light" || s === "dark") { t = s; } }
    if (t) { document.documentElement.setAttribute("data-theme", t); }
  } catch (e) { /* storage unavailable: follow the system theme */ }
})();
</script>
<style>
:root{
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans","DejaVu Sans",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","DejaVu Sans Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --r1:6px;--r2:10px;--r4:22px;
  --t-xs:.75rem;--t-sm:.8125rem;--t-md:.9375rem;--t-xl:1.5rem;
  --tap:44px;
  --bg:#0b0f16;--bg2:#0e131c;--surface:#131a25;--surface2:#19212f;--surface3:#232d3f;
  --line:#242e3e;--line2:#34415a;
  --text:#e8edf5;--muted:#9aa8bd;
  --accent:#ffb224;--accent-ink:#1b1200;--accent-glow:rgba(255,178,36,.45);
  --bad:#ff8080;--focus:#7cc4ff;
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.8);
  --hero-glow:rgba(255,178,36,.09);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#eef1f6;--bg2:#f6f8fb;--surface:#ffffff;--surface2:#f3f5f9;--surface3:#e4e9f1;
    --line:#d8dee9;--line2:#b9c3d4;--text:#131a26;--muted:#53607a;
    --accent:#b45309;--accent-ink:#ffffff;--accent-glow:rgba(180,83,9,.3);
    --bad:#b91c1c;--focus:#1d4ed8;
    --shadow-lg:0 24px 60px -24px rgba(30,41,70,.5);--hero-glow:rgba(180,83,9,.07);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#eef1f6;--bg2:#f6f8fb;--surface:#ffffff;--surface2:#f3f5f9;--surface3:#e4e9f1;
  --line:#d8dee9;--line2:#b9c3d4;--text:#131a26;--muted:#53607a;
  --accent:#b45309;--accent-ink:#ffffff;--accent-glow:rgba(180,83,9,.3);
  --bad:#b91c1c;--focus:#1d4ed8;
  --shadow-lg:0 24px 60px -24px rgba(30,41,70,.5);--hero-glow:rgba(180,83,9,.07);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:var(--s4);
  background:radial-gradient(900px 480px at 50% -10%,var(--hero-glow),transparent 70%),var(--bg);
  color:var(--text);font:var(--t-md)/1.5 var(--font)}
h1,p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus{outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:var(--r1)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

.card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r4);
  box-shadow:var(--shadow-lg);padding:var(--s6) var(--s5) var(--s5)}
.brand{display:flex;flex-direction:column;align-items:center;gap:var(--s3);margin-bottom:var(--s5)}
.brand svg{width:64px;height:64px;filter:drop-shadow(0 0 14px var(--accent-glow))}
.wordmark{font-family:var(--mono);font-weight:700;font-size:1.6rem;letter-spacing:.02em}
.wordmark b{color:var(--accent);font-weight:700}
h1{font-size:var(--t-md);font-weight:500;color:var(--muted);text-align:center}
form{display:grid;gap:var(--s4);margin-top:var(--s5)}
.field{display:grid;gap:6px}
label{font-size:var(--t-sm);font-weight:600}
.input{width:100%;min-height:var(--tap);background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r2);
  padding:0 var(--s3);color:var(--text);transition:border-color .15s,box-shadow .15s}
.input:hover{border-color:var(--muted)}
.input:focus-visible{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 35%,transparent)}
.input[aria-invalid="true"]{border-color:var(--bad)}
.pw{position:relative}
.pw .input{padding-right:48px}
.eye{position:absolute;right:2px;top:2px;width:40px;height:calc(var(--tap) - 4px);display:grid;place-items:center;
  background:transparent;border:0;border-radius:var(--r1);color:var(--muted)}
.eye:hover{color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:48px;padding:0 var(--s5);
  border-radius:var(--r2);border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);
  font-weight:700;font-size:1rem;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none;filter:none}
.msg{display:flex;gap:var(--s2);align-items:flex-start;font-size:var(--t-sm);color:var(--bad);
  border:1px solid var(--bad);border-radius:var(--r2);padding:var(--s3);
  background:color-mix(in srgb,var(--bad) 10%,transparent)}
.msg .ic{width:18px;height:18px;margin-top:1px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.foot{margin-top:var(--s5);text-align:center;font-size:var(--t-xs);color:var(--muted)}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <rect x="1" y="1" width="30" height="30" rx="8" fill="#0b1019" stroke="#33425b"/>
      <g id="logoDots"></g>
    </svg>
    <span class="wordmark">e<b>LM</b>aT<b>rI</b>x</span>
    <h1>Ingresá para controlar el panel</h1>
  </div>

  <form id="form" novalidate>
    <div id="error" class="msg" role="alert" hidden>
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4.5M12 17.3h.01"/></svg>
      <span id="errorText"></span>
    </div>
    <div class="field">
      <label for="user">Usuario</label>
      <input id="user" class="input" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" autofocus required>
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <div class="pw">
        <input id="password" class="input" name="password" type="password" autocomplete="current-password" required>
        <button id="eye" class="eye" type="button" aria-label="Mostrar contraseña" aria-pressed="false">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path id="eyePath" d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/><path id="eyeSlash" d="M4 4l16 16" hidden/></svg>
        </button>
      </div>
    </div>
    <button id="submit" class="btn" type="submit"><span id="submitLabel">Entrar</span></button>
  </form>
  <p class="foot">Conexión local sin cifrar (HTTP): usalo solo en tu red de confianza.</p>
</main>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var NS = "http://www.w3.org/2000/svg";
  var form = $("form"), userEl = $("user"), passEl = $("password"), btn = $("submit"), label = $("submitLabel");
  var busy = false, lockTimer = null, lockUntil = 0;

  // Dot-matrix logo (same mark as the panel).
  (function () {
    var g = $("logoDots"), lit = { "0,0": 1, "1,1": 1, "2,2": 1, "2,0": 1, "0,2": 1 }, x, y;
    for (y = 0; y < 3; y++) {
      for (x = 0; x < 3; x++) {
        var c = document.createElementNS(NS, "circle");
        c.setAttribute("cx", 9 + x * 7); c.setAttribute("cy", 9 + y * 7); c.setAttribute("r", 2.3);
        c.setAttribute("fill", lit[x + "," + y] ? "#ffb224" : "#1f2a3b");
        g.appendChild(c);
      }
    }
  })();

  function showError(text) {
    $("errorText").textContent = text;   // server text is never interpreted as HTML
    $("error").hidden = !text;
    var bad = !!text;
    userEl.setAttribute("aria-invalid", bad ? "true" : "false");
    passEl.setAttribute("aria-invalid", bad ? "true" : "false");
  }

  function setBusy(on) {
    busy = on;
    btn.disabled = on || lockUntil > Date.now();
    while (label.firstChild) { label.removeChild(label.firstChild); }
    if (on) {
      var sp = document.createElement("span");
      sp.className = "spin";
      sp.setAttribute("aria-hidden", "true");
      label.appendChild(sp);
      label.appendChild(document.createTextNode(" Entrando..."));
    } else {
      label.textContent = "Entrar";
    }
  }

  function startLock(seconds) {
    lockUntil = Date.now() + seconds * 1000;
    if (lockTimer) { clearInterval(lockTimer); }
    function tick() {
      var left = Math.ceil((lockUntil - Date.now()) / 1000);
      if (left <= 0) {
        clearInterval(lockTimer); lockTimer = null; lockUntil = 0;
        showError("");
        btn.disabled = busy;
        return;
      }
      showError("Demasiados intentos. Probá de nuevo en " + left + " s");
      btn.disabled = true;
    }
    tick();
    lockTimer = setInterval(tick, 1000);
  }

  $("eye").addEventListener("click", function () {
    var show = passEl.type === "password";
    passEl.type = show ? "text" : "password";
    this.setAttribute("aria-pressed", show ? "true" : "false");
    this.setAttribute("aria-label", show ? "Ocultar contraseña" : "Mostrar contraseña");
    $("eyeSlash").hidden = !show;
    passEl.focus();
  });

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (busy || lockUntil > Date.now()) { return; }
    var user = userEl.value.trim(), password = passEl.value;
    if (!user || !password) {
      showError("Escribí tu usuario y tu contraseña.");
      (user ? passEl : userEl).focus();
      return;
    }
    showError("");
    setBusy(true);
    fetch("/api/login", {
      method: "POST", cache: "no-store", credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user: user, password: password })
    }).then(function (r) {
      return r.text().then(function (txt) {
        var data = null;
        try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = null; }
        if (r.ok) { location.replace("/" + (location.search.indexOf("theme=") >= 0 ? location.search : "")); return; }
        setBusy(false);
        if (r.status === 429) {
          var secs = parseInt(r.headers.get("Retry-After"), 10);
          startLock(secs > 0 ? secs : 60);
        } else if (r.status === 401) {
          showError("Usuario o contraseña incorrectos");
          passEl.select();
          passEl.focus();
        } else {
          showError((data && data.error) || ("Error " + r.status));
        }
      });
    }, function () {
      setBusy(false);
      showError("No se pudo conectar con el servidor. Revisá tu conexión e intentá de nuevo.");
    });
  });

  // Already signed in? Go straight to the panel.
  fetch("/api/auth", { cache: "no-store", credentials: "same-origin" }).then(function (r) {
    return r.json();
  }).then(function (d) {
    if (d && d.authenticated) { location.replace("/"); }
  }, function () { /* stay on the login page */ });
})();
</script>
</body>
</html>
