<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eLMaTrIx</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <canvas id="matrix" aria-label="Pantalla de LEDs"></canvas>
  <!-- Bottom line: credit on the left, version on the right. {{VERSION}} is replaced by the build from appinfo.json
       (opened directly for dev, app.js reads appinfo.json instead). Not focusable, ignores input. -->
  <div id="credit" class="byline"><span class="by-left">Desarrollado por Matias Toro</span><span id="pin" class="by-mid" hidden>Fijo</span><span id="version" class="by-right">v{{VERSION}}</span></div>

  <div id="toast" class="toast" hidden></div>
  <div id="hint" class="hint" hidden>
    <span><b>&larr; &rarr;</b> Cambiar widget</span>
    <span><b>OK</b> Ajustes</span>
    <span class="k yellow">Amarillo</span><span>Pausa</span>
    <span class="k green">Verde</span><span>Fijar modo</span>
    <span class="k red">Rojo</span><span>Ajustes</span>
  </div>

  <div id="sound-hint" class="hint sound" hidden>Pulsa OK para activar el sonido</div>

  <div id="settings" class="settings" hidden>
    <div class="panel">
      <h1 id="s-title"></h1>
      <div id="s-body"></div>
      <p id="s-hint" class="s-hint"></p>
      <p id="s-credit" class="s-hint credit"></p>
    </div>
  </div>

  <script src="js/compat.js"></script>
  <script src="js/fallbackfont.js"></script>
  <script src="js/music/stations.js"></script>
  <script src="js/music/stream.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/bdf.js"></script>
  <script src="js/framebuffer.js"></script>
  <script src="js/textlayout.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/settingsmodel.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/net.js"></script>
  <script src="js/zones.js"></script>
  <script src="js/util.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/context.js"></script>
  <script src="js/keys.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/widgets/clock.js"></script>
  <script src="js/widgets/worldclock.js"></script>
  <script src="js/widgets/countdown.js"></script>
  <script src="js/widgets/rates.js"></script>
  <script src="js/widgets/forecast.js"></script>
  <script src="js/widgets/sports.js"></script>
  <script src="js/widgets/phrases.js"></script>
  <script src="js/widgets/word.js"></script>
  <script src="js/widgets/pixelart.js"></script>
  <script src="js/widgets/matrixrain.js"></script>
  <script src="js/widgets/fireplace.js"></script>
  <script src="js/widgets/aquarium.js"></script>
  <script src="js/widgets/fireworks.js"></script>
  <script src="js/widgets/plasma.js"></script>
  <script src="js/widgets/life.js"></script>
  <script src="js/widgets/starfield.js"></script>
  <script src="js/widgets/visualizer.js"></script>
  <script src="js/widgets/navidad/lib.js"></script>
  <script src="js/widgets/navidad/scenes-a.js"></script>
  <script src="js/widgets/navidad/scenes-b.js"></script>
  <script src="js/widgets/navidad/scenes-c.js"></script>
  <script src="js/widgets/navidad.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
