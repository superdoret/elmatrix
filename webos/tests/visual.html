<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eLMaTrIx</title>
  <base href="../">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <canvas id="matrix" aria-label="Pantalla de LEDs"></canvas>
  <!-- Credit line: the text lives only here. Not focusable, ignores input. -->
  <div id="credit" class="byline">Desarrollado por Matias Toro</div>

  <div id="toast" class="toast" hidden></div>
  <div id="hint" class="hint" hidden>
    <span><b>&larr; &rarr;</b> Cambiar widget</span>
    <span><b>OK</b> Ajustes</span>
    <span class="k yellow">Amarillo</span><span>Pausa</span>
    <span class="k red">Rojo</span><span>Ajustes</span>
  </div>

  <div id="sound-hint" class="hint sound" hidden>Pulsa OK para activar el sonido</div>

  <div id="settings" class="settings" hidden>
    <div class="panel">
      <h1 id="s-title"></h1>
      <div id="s-body"></div>
      <p id="s-hint" class="s-hint"></p>
      <p id="s-credit" class="s-hint credit"></p>
    </div>
  </div>

  <script>
    /* Visual-test harness: serves canned JSON for APIs blocked in the sandbox (CoinGecko, TheSportsDB),
       and optionally for Open-Meteo (?mockweather=1). Everything else goes to the real network. */
    (function () {
      var real = window.fetch.bind(window);
      var q = new URLSearchParams(location.search);
      var map = [
        ['coingecko.com', 'coingecko.json'], ['searchteams', 'sports-teams.json'], ['eventslast', 'sports-last.json'],
        ['eventsnext', 'sports-next.json']
      ];
      if (q.get('mockweather') === '1') map.push(['geocoding-api', 'geocode.json'], ['api.open-meteo', 'forecast.json']);
      if (q.get('mockdolar') === '1') map.push(['dolarapi.com', 'dolarapi.json']);
      window.fetch = function (url, opts) {
        for (var i = 0; i < map.length; i++) if (String(url).indexOf(map[i][0]) >= 0) return real('tests/fixtures/' + map[i][1]);
        return real(url, opts);
      };
    })();
  </script>
